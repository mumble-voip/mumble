name: PR-Checks

on: [pull_request]

jobs:
  pr-checks:
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:

    - name: Install Python
      run: sudo apt install python3
      shell: bash

    - uses: actions/checkout@v6
      with:
          # Assume that there are not >200 new commits that need checking
          fetch-depth: 200
          submodules: 'recursive'
          # Don't create a merge commit
          ref: ${{ github.event.pull_request.head.sha }}

    - name: Check commit style
      run: $GITHUB_WORKSPACE/.github/workflows/check_commit_style.py ${{ github.base_ref }}
      shell: bash

    - name: Check line endings
      uses: erclu/check-crlf@master
      with:
          exclude: '3rdparty/'

    - uses: ./.github/actions/install-dependencies
      with:
          type: shared
          os: ${{ matrix.os }}
          arch: x86_64

    - name: Generate compile-command DB
      run: |
        mkdir build
        cmake -B build -S .\
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES='cmake/mumble_dependency_provider.cmake'
        ln -s build/compile_commands.json .
      shell: bash

    - name: Check code formatting
      uses: jidicula/clang-format-action@v4.18.0
      with:
          clang-format-version: '10'
          check-path: '.'
          exclude-regex: '(\\.git/.*|3rdparty/.*|build/.*|.*proto$)'
